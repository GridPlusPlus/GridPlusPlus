<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">打地鼠的四個製作階段</title>
  <desc id="desc">依序顯示靜態地鼠、移動地鼠、分數與倒數重設。</desc>
  <rect width="920" height="520" rx="20" fill="#f7f8fc"/>
  <g font-family="sans-serif" fill="#1e293b">
    <text x="35" y="45" font-size="26" font-weight="700">打地鼠的四個製作階段</text>
    <g transform="translate(35 80)">
      <g transform="translate(0 0)"><rect width="195" height="350" rx="12" fill="white" stroke="#cbd5e1"/><text x="15" y="30" font-size="18" font-weight="700">1　生成</text><rect x="15" y="55" width="165" height="165" fill="#fff" stroke="#94a3b8"/><path d="M56 55v165M97 55v165M138 55v165M15 96h165M15 137h165M15 178h165" stroke="#cbd5e1"/><rect x="18" y="58" width="35" height="35" fill="#ef4444"/><text x="15" y="260" font-size="15">紅色方塊出現在</text><text x="15" y="285" font-size="15">指定網格座標</text></g>
      <g transform="translate(215 0)"><rect width="195" height="350" rx="12" fill="white" stroke="#cbd5e1"/><text x="15" y="30" font-size="18" font-weight="700">2　移動</text><rect x="15" y="55" width="165" height="165" fill="#fff" stroke="#94a3b8"/><path d="M56 55v165M97 55v165M138 55v165M15 96h165M15 137h165M15 178h165" stroke="#cbd5e1"/><rect x="101" y="141" width="35" height="35" fill="#ef4444"/><path d="M40 80C80 80 85 145 98 151" fill="none" stroke="#4f46e5" stroke-width="4" stroke-dasharray="6 5"/><text x="15" y="260" font-size="15">地鼠每秒換到</text><text x="15" y="285" font-size="15">另一個有效格子</text></g>
      <g transform="translate(430 0)"><rect width="195" height="350" rx="12" fill="white" stroke="#cbd5e1"/><text x="15" y="30" font-size="18" font-weight="700">3　計分</text><text x="18" y="82" font-size="18" fill="#334155">Score: 3</text><rect x="15" y="100" width="165" height="120" fill="#fff" stroke="#94a3b8"/><rect x="100" y="143" width="35" height="35" fill="#ef4444"/><circle cx="118" cy="160" r="30" fill="none" stroke="#4f46e5" stroke-width="3"/><text x="15" y="260" font-size="15">只有點中地鼠</text><text x="15" y="285" font-size="15">才會增加分數</text></g>
      <g transform="translate(645 0)"><rect width="195" height="350" rx="12" fill="white" stroke="#cbd5e1"/><text x="15" y="30" font-size="18" font-weight="700">4　結束與重設</text><rect x="15" y="55" width="165" height="165" fill="#1e293b"/><text x="30" y="100" font-size="18" fill="white">Time: 0</text><text x="30" y="140" font-size="16" fill="#facc15">Press R</text><text x="15" y="260" font-size="15">時間歸零後隱藏</text><text x="15" y="285" font-size="15">按 R 開始下一局</text></g>
    </g>
  </g>
</svg>

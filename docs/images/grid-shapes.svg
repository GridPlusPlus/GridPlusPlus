<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" role="img" aria-labelledby="title desc">
  <title id="title">Grid++ 五種基本圖形</title>
  <desc id="desc">紅色方形、橘色圓形、綠色三角形、藍色五邊形與紫色五角星各自置中於格子。</desc>
  <rect width="820" height="220" rx="18" fill="#f7f8fc"/>
  <g transform="translate(35 35)" stroke="#cbd5e1" fill="white">
    <rect width="140" height="140"/><rect x="150" width="140" height="140"/><rect x="300" width="140" height="140"/><rect x="450" width="140" height="140"/><rect x="600" width="140" height="140"/>
  </g>
  <rect x="80" y="80" width="50" height="50" fill="#ef4444"/>
  <circle cx="255" cy="105" r="27" fill="#f59e0b"/>
  <polygon points="405,72 374,132 436,132" fill="#22c55e"/>
  <polygon points="555,72 588,96 575,135 535,135 522,96" fill="#3b82f6"/>
  <polygon points="705,69 714,94 741,95 719,111 727,137 705,122 683,137 691,111 669,95 696,94" fill="#a855f7"/>

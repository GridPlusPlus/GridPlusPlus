site_name: Grid++ 文件
site_description: 給程式初學者的網格遊戲引擎
docs_dir: docs

plugins:
  - search
  - mkdoxy:
      projects:
        gridpp:
          src-dirs: GridPlusPlus.h GameEngine.h GridObject.h Overlay.h GridMaze.h
          api-path: api
          full-doc: true
          doxy-cfg-file: Doxyfile
          doxy-cfg:
            GENERATE_XML: true
            GENERATE_HTML: false
            GENERATE_LATEX: false

theme:
  name: material
  language: zh-TW
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: 切換深色模式
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: 切換淺色模式

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.keys
  # 教學頁面用 --8<-- 從 examples/ 與 docs_includes/ 引入程式碼和共用段落。
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 首頁: index.md
  - 1 開始使用:

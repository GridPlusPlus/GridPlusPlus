site_name: Grid++ 文件
site_description: 給程式初學者的網格遊戲引擎
docs_dir: docs

plugins:
  - search
  - mkdoxy:
      projects:
        gridpp:
          src-dirs: GridPlusPlus.h Game.h GridEngine.h GridObject.h Overlay.h GridMaze.h GridShapes.h
          api-path: api
          full-doc: true
          doxy-cfg-file: Doxyfile
          doxy-cfg:
            GENERATE_XML: true
            GENERATE_HTML: false
            GENERATE_LATEX: false

theme:
  name: material
  language: zh-TW
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: 切換深色模式
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: 切換淺色模式

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 首頁: index.md
  - 1 開始使用:
      - 01-getting-started/index.md
      - 1.1 安裝 raylib: 01-getting-started/01-installation.md
      - 1.2 第一個 Grid++ 程式: 01-getting-started/02-hello-gridpp.md
  - 2 理解核心模型:
      - 02-core-model/index.md
      - 2.1 ObjectHandler: 02-core-model/02-grid-object.md
      - 2.2 Game: 02-core-model/01-grid-engine.md
      - 2.3 OverlayHandler: 02-core-model/03-overlay.md
      - 2.4 輸入、時間與亂數: 02-core-model/04-raylib-input.md
  - 3 製作打地鼠:
      - 03-whack-a-mole/index.md
  - 4 定義物件行為:
      - 04-object-behavior/index.md
      - 4.1 UpdateFn 與 CollideFn: 04-object-behavior/01-callbacks.md
      - 4.2 同格互動: 04-object-behavior/02-collisions.md
  - 5 物件狀態:
      - 05-object-state/index.md
      - 5.1 set 與 get: 05-object-state/01-custom-grid-object.md
      - 5.2 Init 與 Handler: 05-object-state/02-lifecycle-methods.md
  - 6 素材與繪製:
      - 06-drawing/index.md
      - 6.1 素材包: 06-drawing/01-assets.md
      - 6.2 基本圖形: 06-drawing/02-shapes.md
      - 6.3 繪製狀態與順序: 06-drawing/03-rendering.md
  - 7 解析 Pacman:
      - 07-pacman/index.md
      - 7.1 地圖與迷宮: 07-pacman/01-map-and-maze.md
      - 7.2 玩家移動: 07-pacman/02-player.md
      - 7.3 豆子與勝利條件: 07-pacman/03-pellets.md
      - 7.4 多隻鬼的獨立狀態: 07-pacman/04-ghosts.md
      - 7.5 遊戲狀態與 Overlay: 07-pacman/05-game-states.md
  - 8 生命週期與所有權:
      - 08-lifecycle/index.md
      - 8.1 Game 與 Handler 壽命: 08-lifecycle/02-ownership.md
      - 8.2 每幀執行順序: 08-lifecycle/03-frame-order.md
      - 8.3 執行期間新增與刪除: 08-lifecycle/01-runtime-changes.md
  - 9 保存與發布: 
      - 09-sharing/index.md
  - API 參考:
      - 總覽: api/index.md
      - 類別列表: api/annotated.md
      - 類別索引: api/classes.md
      - 命名空間: api/namespaces.md
      - 檔案: api/files.md

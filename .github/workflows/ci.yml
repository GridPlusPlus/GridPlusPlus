name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .github/ci/raylib.h 是只供編譯檢查的 raylib 替身，CI 因此不必安裝 raylib。
      - name: Compile examples
        run: |
          set -eux
          g++ -std=c++17 -Wall -Wextra -pedantic -I.github/ci -I. template.cpp -o /tmp/template
          g++ -std=c++17 -Wall -Wextra -pedantic -I.github/ci -I. examples/whack_a_mole/step_01_board.cpp -o /tmp/whack-board
          g++ -std=c++17 -Wall -Wextra -pedantic -I.github/ci -I. examples/whack_a_mole/step_02_mole.cpp -o /tmp/whack-mole
          g++ -std=c++17 -Wall -Wextra -pedantic -I.github/ci -I. examples/whack_a_mole/main.cpp -o /tmp/whack-a-mole
          g++ -std=c++17 -Wall -Wextra -pedantic -I.github/ci -I. examples/pacman/main.cpp -o /tmp/pacman
          g++ -std=c++17 -Wall -Wextra -pedantic -I.github/ci -I. examples/pacman_tutorial/main.cpp -o /tmp/tutorial
          for step in examples/pacman_tutorial/steps/step*.cpp; do
            g++ -std=c++17 -Wall -Wextra -pedantic -I.github/ci -I. "$step" -o "/tmp/tutorial-$(basename "$step" .cpp)"
          done

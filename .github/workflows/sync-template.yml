name: Sync template

on:
  push:
    branches: [main]
    paths:
      - "GridPlusPlus.h"
      - "GridEngine.h"
      - "GridObject.h"
      - "Overlay.h"
      - "GridMaze.h"
      - "GridShapes.h"
      - "GridAssetManager.h"
      - "GridSQLite.h"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Grid++
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check out template repository
        uses: actions/checkout@v4
        with:
          repository: GridPlusPlus/GridPlusPlus-Template
          token: ${{ secrets.TEMPLATE_REPO_TOKEN }}
          path: template

      - name: Copy template files
        run: |
          cp source/GridPlusPlus.h source/GridEngine.h source/GridObject.h \
            source/Overlay.h source/GridMaze.h source/GridShapes.h \
            source/GridAssetManager.h source/GridSQLite.h source/LICENSE template/

      - name: Compile template
        run: g++ -std=c++17 -Wall -Wextra -pedantic -Isource/tests/stubs -Itemplate template/main.cpp -o /tmp/gridpp-template

      - name: Push changes
        working-directory: template
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GridPlusPlus.h GridEngine.h GridObject.h Overlay.h GridMaze.h \
            GridShapes.h GridAssetManager.h GridSQLite.h LICENSE
          git commit -m "Sync Grid++ files"
          git push
